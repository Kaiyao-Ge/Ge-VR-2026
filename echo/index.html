<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo prototype</title>
<style>
   html, body { margin: 0; height: 100%; background: #000; color: #cfe3ff; font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
   canvas#view { display: block; width: 100vw; height: 100vh; }
   #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.85); }
   #start button { font: inherit; font-size: 18px; padding: 10px 28px; background: #0c2233; color: #8fe9ff; border: 1px solid #4de6ff; border-radius: 6px; cursor: pointer; }
   #start p { margin: 0; color: #7f93a8; text-align: center; }
   #panel { position: fixed; top: 12px; right: 12px; width: 250px; padding: 10px 12px; background: rgba(4,10,18,.8); border: 1px solid #1d3a50; border-radius: 6px; }
   #panel label { display: grid; grid-template-columns: 1fr 44px; align-items: center; font-size: 12px; }
   #panel input { grid-column: 1 / 3; width: 100%; }
   #panel .help { margin-top: 6px; font-size: 12px; color: #7f93a8; }
   #hud { position: fixed; left: 12px; bottom: 12px; border: 1px solid #1d3a50; border-radius: 6px; background: rgba(4,10,18,.8); }
   #msg { position: fixed; left: 12px; top: 12px; color: #ffd84d; font-size: 13px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud" width="380" height="150"></canvas>
<div id="msg"></div>
<div id="panel">
   <label>波速 m/s <span id="speedV"></span><input id="speed" type="range" min="1" max="12" step=".5" value="5"></label>
   <label>距离衰减 <span id="falloffV"></span><input id="falloff" type="range" min="0" max="1" step=".01" value=".12"></label>
   <label>亮度 <span id="gainV"></span><input id="gain" type="range" min=".3" max="5" step=".1" value="1"></label>
   <label>毛刺密度 <span id="grainV"></span><input id="grain" type="range" min=".3" max="3" step=".05" value="1"></label>
   <label>振幅 mm <span id="ampV"></span><input id="amp" type="range" min="0" max="15" step=".5" value="6"></label>
   <label>波长 cm <span id="waveV"></span><input id="wave" type="range" min="1" max="12" step=".5" value="4"></label>
   <label>门限 dB <span id="gateV"></span><input id="gate" type="range" min="-80" max="-20" step="1" value="-55"></label>
   <label>分辨率 × <span id="resV"></span><input id="res" type="range" min=".5" max="2" step=".25" value="1"></label>
   <div class="help">点击画面锁定鼠标 · WASD 移动 · Esc 解锁<br>合成声音：1 咂舌 · 2 哼 · 3 "你好"<br>G 显示/隐藏房间轮廓（调试）</div>
</div>
<div id="start">
   <button id="go">开始（允许麦克风）</button>
   <p>对着麦克风说话、咂舌或哼唱。<br>没有麦克风也可以用 1/2/3 键合成声音。</p>
</div>
<script type="module" src="./echo.js"></script>
</body>
</html>
